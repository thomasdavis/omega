name: Temporary External Historical Inference

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - scripts/generate_external_historical_conversations.py
      - .github/workflows/external-historical-inference.yml

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 'tmp/external-inference-probe-20260808'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify external API credential exists
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get('OPENAI_API_KEY'):
              raise SystemExit('OPENAI_API_KEY repository secret is unavailable')
          print('External OpenAI credential is available; value not displayed.')
          PY

      - name: Generate 50 conversations through hosted OpenAI inference
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          OPENAI_API_URL: https://api.openai.com/v1/chat/completions
          INFERENCE_CONCURRENCY: '4'
          OUTPUT_DIR: external-historical-inference-output
        run: python scripts/generate_external_historical_conversations.py

      - name: Upload external-inference corpus and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-conversations-external-50
          path: external-historical-inference-output/
          if-no-files-found: error
          retention-days: 1
